name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Lists public tables without RLS; skips (warns) when DATABASE_URL
      # secret is not configured, enforces it when it is.
      - run: pnpm check:rls
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # E2E needs a seeded environment; runs only when staging secrets are set.
      - id: e2e
        run: |
          if [ -n "${{ secrets.PLAYWRIGHT_BASE_URL }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.e2e.outputs.run == 'true'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_EMAIL: ${{ secrets.PLAYWRIGHT_EMAIL }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
          PLAYWRIGHT_GARAGE_SLUG: ${{ secrets.PLAYWRIGHT_GARAGE_SLUG }}

      - run: pnpm build
